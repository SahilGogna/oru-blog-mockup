<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ORU Admin - Community Resources</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#7C3AED',
            'primary-dark': '#6D28D9',
            'sidebar-bg': '#F8F7FC',
            'sidebar-active': '#7C3AED'
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="styles.css">
</head>

<body class="min-h-screen bg-white">
  <!-- Main Layout -->
  <div class="flex min-h-screen">
    <!-- Sidebar -->
    <aside id="sidebar" class="w-64 bg-sidebar-bg border-r border-gray-200 flex flex-col">
      <!-- Logo -->
      <div class="p-4 border-b border-gray-200">
        <div class="flex items-center gap-2">
          <svg class="w-8 h-8 text-primary" viewBox="0 0 32 32" fill="currentColor">
            <circle cx="8" cy="16" r="6" opacity="0.6" />
            <circle cx="24" cy="16" r="6" opacity="0.8" />
            <circle cx="16" cy="8" r="6" />
          </svg>
          <span class="text-xl font-bold text-gray-800">ORU</span>
        </div>
      </div>

      <!-- User Name -->
      <div class="px-4 py-3 border-b border-gray-200">
        <span class="text-sm font-semibold text-gray-700">Sahil Gogna</span>
      </div>

      <!-- Navigation -->
      <nav class="flex-1 p-2">
        <ul class="space-y-1">
          <li>
            <a href="#" class="nav-item flex items-center gap-3 px-3 py-2 rounded-lg text-gray-600 hover:bg-gray-100">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
              </svg>
              <span>Applications</span>
            </a>
          </li>
          <li>
            <a href="#" class="nav-item flex items-center gap-3 px-3 py-2 rounded-lg text-gray-600 hover:bg-gray-100">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
              </svg>
              <span>Mentor Applications</span>
            </a>
          </li>
          <li>
            <a href="#" class="nav-item flex items-center gap-3 px-3 py-2 rounded-lg text-gray-600 hover:bg-gray-100">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
              </svg>
              <span>Sessions</span>
            </a>
          </li>
          <li>
            <a href="#" class="nav-item flex items-center gap-3 px-3 py-2 rounded-lg text-gray-600 hover:bg-gray-100">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
              </svg>
              <span>Member Management</span>
            </a>
          </li>
          <li>
            <a href="#" id="nav-resources"
              class="nav-item active flex items-center gap-3 px-3 py-2 rounded-lg bg-primary text-white">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
              </svg>
              <span>Resources</span>
            </a>
          </li>
        </ul>
      </nav>
    </aside>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col">
      <!-- Top Header -->
      <header class="h-14 border-b border-gray-200 flex items-center justify-between px-6 bg-white">
        <nav class="flex items-center gap-4 text-sm text-gray-600">
          <a href="#" class="hover:text-primary">Dashboard</a>
          <a href="#" class="hover:text-primary">Join ORU</a>
          <a href="#" class="hover:text-primary">Success Stories</a>
          <a href="#" class="hover:text-primary">Workshops</a>
          <button id="view-toggle-btn" onclick="toggleView()"
            class="bg-primary text-white px-3 py-1 rounded-full text-sm flex items-center gap-1 hover:bg-primary-dark transition-colors">
            <span>MyOru</span>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
            </svg>
          </button>
        </nav>
        <div class="w-9 h-9 rounded-full bg-primary text-white flex items-center justify-center text-sm font-medium">
          SG
        </div>
      </header>

      <!-- Page Content -->
      <main id="main-content" class="flex-1 p-6 overflow-auto relative">
        <!-- Content will be rendered here by JavaScript -->
      </main>
    </div>
  </div>

  <!-- Background Gradient -->
  <div class="gradient-bg"></div>

  <!-- Modal Container -->
  <div id="modal-container" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50">
    <div id="modal-content" class="bg-white rounded-xl shadow-xl w-full max-w-md mx-4">
      <!-- Modal content will be rendered here -->
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2">
    <!-- Toasts will appear here -->
  </div>

  <script src="app.js"></script>
</body>

</html>
